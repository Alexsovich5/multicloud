version: "3.6"

# One image serves all three services; only api builds it. The API port is
# published on 127.0.0.1 only; moto and fake-arm are not published at all.
# The API key is generated on first start into the api-key volume.
services:
  api:
    build: .
    image: multicloud:dev
    command: gunicorn -b 0.0.0.0:8000 "app:create_app()"
    environment:
      MC_AWS_ENDPOINT: http://moto:5000
      MC_AZURE_BASE_URL: http://fake-arm:5001
    depends_on:
      - moto
      - fake-arm
    volumes:
      - api-key:/run/multicloud
    ports:
      - "127.0.0.1:20901:8000"

  moto:
    image: multicloud:dev
    command: moto_server ec2 -H 0.0.0.0 -p 5000

  fake-arm:
    image: multicloud:dev
    command: python -m simulators.fake_arm
    environment:
      HOST: 0.0.0.0
      PORT: "5001"

volumes:
  api-key:

networks:
  default:
    ipam:
      config:
        - subnet: 172.49.0.0/24
